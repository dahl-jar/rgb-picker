name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  build:
    name: Build Windows release
    runs-on: windows-latest
    steps:
      - name: Configure Git line endings
        run: git config --global core.autocrlf input
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up MSYS2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-nsis
      - name: Validate version tag
        id: version
        shell: msys2 {0}
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            exit 1
          fi
          echo "value=${GITHUB_REF_NAME#v}" >> "${GITHUB_OUTPUT}"
      - name: Configure
        shell: msys2 {0}
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DRGBPICKER_REQUIRE_MINGW_RUNTIME_DLLS=ON
          -DRGBPICKER_VERSION=${{ steps.version.outputs.value }}
          -DRGBPICKER_WARNINGS_AS_ERRORS=ON
          -DBUILD_TESTING=ON
      - name: Build
        shell: msys2 {0}
        run: cmake --build build --parallel
      - name: Test
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure
      - name: Verify install manifest
        shell: msys2 {0}
        run: |
          cmake --install build --prefix stage
          test -f stage/rgb-picker.exe
          test -f stage/rgb-ctl.exe
          test -f stage/libusb-1.0.dll
          test -f stage/libgcc_s_seh-1.dll
          test -f stage/libstdc++-6.dll
          test -f stage/libwinpthread-1.dll
          test -f stage/fonts/Roboto.ttf
          test -f stage/fonts/OFL.txt
          test -f stage/LICENSE
          test -f stage/NOTICE.md
          test -f stage/licenses/Dear-ImGui-MIT.txt
          test -f stage/licenses/hidapi-BSD-3-Clause.txt
          test -f stage/licenses/libusb-LGPL-2.1.txt
          test -f stage/licenses/mingw-gcc/COPYING.RUNTIME
          test -f stage/licenses/mingw-winpthreads/COPYING
      - name: Package
        shell: msys2 {0}
        run: |
          cpack --config build/CPackConfig.cmake -G ZIP -B artifacts
          cpack --config build/CPackConfig.cmake -G NSIS -B artifacts
          cd artifacts
          sha256sum *.exe *.zip > SHA256SUMS.txt
      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rgb-picker-${{ github.ref_name }}-windows-x64
          path: |
            artifacts/*.zip
            artifacts/*.exe
            artifacts/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: rgb-picker-${{ github.ref_name }}-windows-x64
          path: artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" artifacts/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" artifacts/* \
              --generate-notes \
              --title "${GITHUB_REF_NAME}" \
              --verify-tag
          fi
